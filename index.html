<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Science Library Simulator</title>
<meta name="description" content="A classroom simulator for teaching NumPy, Pandas, Matplotlib, Seaborn, Scikit-learn and SciPy to Business Analytics students." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell" id="appShell">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-header-row">
        <div class="brand">
          <span class="brand-icon"><i class="fa-solid fa-flask-vial"></i></span>
          <div class="brand-text">
            <p class="brand-title">Analytics Lab</p>
            <p class="brand-subtitle">Business Analytics Simulator</p>
          </div>
        </div>
        <button class="icon-btn sidebar-toggle" id="sidebarToggle" title="Collapse sidebar">
          <svg class="sidebar-toggle-icon" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2.5" y="3.5" width="15" height="13" rx="2.5" stroke="currentColor" stroke-width="1.4"/>
            <line x1="7.75" y1="3.5" x2="7.75" y2="16.5" stroke="currentColor" stroke-width="1.4"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search a topic…" autocomplete="off" />
    </div>

    <nav id="libraryNav" class="library-nav" aria-label="Library topics"></nav>

    <div class="sidebar-footer">
      <div class="progress-row">
        <span class="progress-label" id="progressLabel">0 / 0 covered</span>
        <button class="icon-btn" id="themeToggle" title="Toggle light / dark">
          <i class="fa-solid fa-sun"></i>
        </button>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <main class="main-panel">
    <section id="contentArea" class="content-area"></section>
  </main>

</div>

<!-- app.js defines registerTopic() and must load before the topic data files below -->
<script src="app.js"></script>

<!-- NumPy -->
<script src="numpy/01-array-basics.js"></script>

<!-- Pandas -->
<script src="pandas/01-series-dataframe-basics.js"></script>

<!-- Matplotlib -->
<script src="matplotlib/01-line-chart.js"></script>

<!-- Seaborn -->
<script src="seaborn/01-distribution-plot.js"></script>

<!-- Scikit-learn -->
<script src="scikit-learn/01-train-test-split.js"></script>

<!-- SciPy -->
<script src="scipy/01-descriptive-stats.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
