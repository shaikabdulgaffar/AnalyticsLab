<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Science Library Simulator</title>
<meta name="description" content="A classroom simulator for teaching NumPy, Pandas, Matplotlib, Seaborn, Scikit-learn and SciPy to Business Analytics students." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell" id="appShell">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-header-row">
        <div class="brand">
          <span class="brand-icon"><i class="fa-solid fa-flask-vial"></i></span>
          <div class="brand-text">
            <p class="brand-title">Analytics Lab</p>
            <p class="brand-subtitle">Business Analytics Simulator</p>
          </div>
        </div>
        <button class="icon-btn sidebar-toggle" id="sidebarToggle" title="Collapse sidebar">
          <i class="fa-solid fa-angles-left sidebar-toggle-icon"></i>
        </button>
      </div>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search a topic…" autocomplete="off" />
    </div>

    <nav id="libraryNav" class="library-nav" aria-label="Library topics"></nav>

    <div class="sidebar-footer">
      <div class="progress-row">
        <span class="progress-label" id="progressLabel">0 / 0 covered</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <main class="main-panel">
    <section id="contentArea" class="content-area"></section>
  </main>

</div>

<!-- Order matters: app.js first (it defines registerTopic), then the library files.
     Sidebar order is controlled by LIBRARY_META in app.js, not by this order. -->
<script src="app.js"></script>
<script src="numpy.js"></script>
<script src="pandas.js"></script>
<script src="matplotlib.js"></script>
<script src="seaborn.js"></script>
<script src="scikitlearn.js"></script>
<script src="scipy.js"></script>

</body>
</html>
