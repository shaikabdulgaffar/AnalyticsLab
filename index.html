<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data Science Lectures</title>
<meta name="description" content="Lecture companion for teaching NumPy, Pandas, Matplotlib, Seaborn, Scikit-learn and SciPy to Business Analytics students." />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell" id="appShell">

  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-header-row">
        <div class="brand">
          <div class="brand-text">
            <p class="brand-title">Data Science Libraries</p>
          </div>
        </div>
        <button class="icon-btn sidebar-close" id="sidebarClose" type="button" title="Close menu" aria-label="Close menu">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <button class="icon-btn sidebar-toggle" id="sidebarToggle" title="Collapse sidebar">
          <svg class="sidebar-toggle-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.75" y="3.75" width="14.5" height="12.5" rx="3"/><line x1="7.5" y1="3.75" x2="7.5" y2="16.25"/></svg>
        </button>
      </div>
    </div>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="searchInput" placeholder="Search a topic…" autocomplete="off" />
    </div>

    <nav id="libraryNav" class="library-nav" aria-label="Library topics"></nav>

    <div class="sidebar-footer">
      <div class="progress-row">
        <span class="progress-label" id="progressLabel">0 / 0 covered</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <main class="main-panel">
    <!-- Mobile / small screens only: this is the button that opens the sidebar drawer. -->
    <header class="mobile-topbar">
      <button class="icon-btn menu-btn" id="menuToggle" type="button" title="Open topics menu" aria-label="Open topics menu" aria-expanded="false">
        <i class="fa-solid fa-bars"></i>
      </button>
      <p class="mobile-topbar-title" id="mobileTitle">Data Science Libraries</p>
    </header>
    <section id="contentArea" class="content-area"></section>
  </main>

</div>

<!-- Order matters: app.js first (it defines registerTopic), then the library files.
     Sidebar order is controlled by LIBRARY_META in app.js, not by this order. -->
<script src="app.js"></script>
<script src="python.js"></script>
<script src="numpy.js"></script>
<script src="pandas.js"></script>
<script src="matplotlib.js"></script>
<script src="seaborn.js"></script>
<script src="scikitlearn.js"></script>
<script src="scipy.js"></script>

</body>
</html>
